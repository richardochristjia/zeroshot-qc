server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same origin as the page: no CORS, whatever CORS_ORIGINS says.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
    }

    location /files/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
