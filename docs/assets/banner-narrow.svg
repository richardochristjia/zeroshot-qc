<title id="t">ZeroShot QC: zero-training visual inspection</title>
<desc id="d">Dark banner. ZeroShot QC, zero-training visual inspection: SAM 3.1 finds candidate defects from text prompts and Muse Spark judges the part against plain-English rules and a known-good reference. 0.919 F1 on MVTec AD across 5 categories, 0 training images. Three steps: a text prompt from the screw profile, SAM 3.1 segmenting candidate regions on a screw, and Muse Spark returning FAIL against the rule that any head scratch, thread damage or deformation fails.</desc>
