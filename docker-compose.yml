# Single-command local run: backend (:8000) + frontend (:8080).
# Setup: cp .env.example .env (see README for details).
# Run: docker compose up --build

services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - zqc-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  zqc-data:
