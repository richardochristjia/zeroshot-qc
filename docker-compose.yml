# Single-command local run: backend (:8000) + frontend (:8080).
# No setup needed: .env is optional (add META_API_KEY there for live models).
# Run: docker compose up --build

services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      SAM_MODEL_ID: ${SAM_MODEL_ID:-sam-3.1}
      JUDGE_MODEL_ID: ${JUDGE_MODEL_ID:-muse-spark-1.3}
      IMAGE_MODEL_ID: ${IMAGE_MODEL_ID:-muse-image-1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    volumes:
      - zqc-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  zqc-data:
